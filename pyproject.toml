[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "1.0.0"
description = "CLI personal assistant: address book with birthdays and a tagged note book"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nazar Huk" },
    { name = "Mikhail Orlov" },
]
keywords = ["cli", "address-book", "notes", "assistant"]
dependencies = [
    "colorama>=0.4.6",
]

[project.scripts]
personal-assistant = "personal_assistant.main:main"

[tool.setuptools]
packages = ["personal_assistant"]
